<title>Laboratorio Giallo Touch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: banco di prova. A sinistra il telefono in scala reale (411×911 dp, CMF Phone 2 Pro in verticale),
   a destra le regolazioni; su telefono le regolazioni stanno in un foglio a comparsa. */
:root{
  --bg:#e8ebf1; --surface:#ffffff; --fg:#1b1d2a; --muted:#565d76; --line:#d2d7e3;
  --accent:#8a6800; --accent-fill:#f6c933; --on-accent:#1b1a12; --ok:#1f7a45; --frame:#0c0c13;
  --font-ui:"Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-px:"Pixelify Sans", "Courier New", monospace;
  /* aspetto fisso dell'app (uguale in tema chiaro e scuro) */
  --p-ink:#171624; --p-panel:#232139; --p-panel2:#2e2b49; --p-line:#403c62;
  --p-y:#f6c933; --p-y2:#ffe07a; --p-text:#fff7dc; --p-dim:#aaa4c8;
  --p-red:#ef5b5b; --p-green:#58cf7c; --p-amber:#f2b23a; --p-paper:#fbfbf3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#111219; --surface:#1b1d2a; --fg:#eceef6; --muted:#9ca2ba; --line:#2c2f45;
    --accent:#f6c933; --accent-fill:#f6c933; --on-accent:#1b1a12; --ok:#58cf7c; --frame:#000000; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#111219; --surface:#1b1d2a; --fg:#eceef6; --muted:#9ca2ba; --line:#2c2f45;
  --accent:#f6c933; --accent-fill:#f6c933; --on-accent:#1b1a12; --ok:#58cf7c; --frame:#000000; color-scheme:dark; }

[hidden]{ display:none!important; }
html,body{ height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--font-ui); font-size:15px; }
*{ box-sizing:border-box; }
button{ font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
button:focus-visible, textarea:focus-visible{ outline:3px solid var(--accent-fill); outline-offset:2px; }

.page{ max-width:1180px; margin:0 auto; padding-block:12px 20px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
header h1{ margin:0; font-size:clamp(20px, 2.6vw, 28px); font-weight:700; letter-spacing:-.01em; text-wrap:balance; }
header p{ margin:4px 0 0; color:var(--muted); font-size:14px; line-height:1.45; max-width:70ch; }
.bar-top{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:12px 0; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; }
.tab{ border:1px solid var(--line); background:var(--surface); color:var(--fg); border-radius:12px; padding:9px 14px; font-weight:600; font-size:14px; min-height:42px; }
.tab[aria-selected="true"]{ background:var(--accent-fill); border-color:var(--accent-fill); color:var(--on-accent); }
.tools{ margin-left:auto; display:flex; gap:6px; }
.tool{ border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:12px; padding:9px 12px; font-weight:600; font-size:14px; min-height:42px; }
#openSet{ display:none; }

.main{ display:grid; grid-template-columns:minmax(300px, 440px) minmax(0,1fr); gap:28px; align-items:start; }
#stageCol{ display:flex; justify-content:center; min-width:0; }
#stageHolder{ position:relative; }
#stageHolder.imm{ position:fixed; inset:0; z-index:70; background:var(--p-ink); width:auto!important; height:auto!important; }
#exitImm{ position:fixed; z-index:80; top:calc(10px + env(safe-area-inset-top, 0px)); right:calc(10px + env(safe-area-inset-right, 0px));
  background:var(--p-text); color:var(--p-ink); border:0; border-radius:12px; padding:10px 14px; font-weight:700; }

/* ---------- Telefono ---------- */
#stage{ position:absolute; left:0; top:0; width:411px; height:911px; transform-origin:0 0; overflow:hidden;
  border-radius:38px; background:var(--p-ink); color:var(--p-text); box-shadow:0 0 0 9px var(--frame), 0 24px 50px rgba(0,0,0,.28);
  touch-action:none; user-select:none; -webkit-user-select:none; font-family:var(--font-ui); }
#stageHolder.imm #stage{ border-radius:0; box-shadow:none; }
.sys-status{ position:absolute; inset:0 0 auto; height:34px; display:flex; align-items:center; justify-content:space-between; padding:0 24px;
  font-size:13px; font-weight:600; background:var(--p-ink); z-index:5; font-variant-numeric:tabular-nums; }
.cam{ position:absolute; left:50%; top:9px; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:#04040a; box-shadow:inset 0 0 0 2px #24243a; }
.sys-ic{ display:flex; gap:6px; align-items:center; }
.sys-ic i{ display:block; width:16px; height:9px; border:1.5px solid var(--p-text); border-radius:2px; position:relative; }
.sys-ic i::after{ content:""; position:absolute; inset:1px 4px 1px 1px; background:var(--p-text); border-radius:1px; }
.sys-ic b{ display:block; width:12px; height:9px; background:linear-gradient(90deg, var(--p-text) 0 2px, transparent 2px 3px, var(--p-text) 3px 5px, transparent 5px 6px, var(--p-text) 6px 8px, transparent 8px 9px, var(--p-text) 9px); clip-path:polygon(0 100%,100% 0,100% 100%); }
.sys-nav{ position:absolute; inset:auto 0 0; height:24px; display:grid; place-items:center; background:var(--p-ink); z-index:25; }
.sys-nav span{ width:112px; height:4px; border-radius:2px; background:var(--p-dim); }

#game{ position:absolute; top:34px; left:0; width:411px; height:370px; background:#000; overflow:hidden; }
#cv{ width:100%; height:100%; display:block; image-rendering:crisp-edges; image-rendering:pixelated; }
#textbox{ position:absolute; left:6px; right:6px; bottom:6px; height:112px; z-index:6; background:var(--p-paper); color:var(--p-ink);
  border:3px solid var(--p-ink); border-radius:6px; box-shadow:inset 0 0 0 3px var(--p-paper), inset 0 0 0 5px var(--p-ink);
  padding:15px 20px; font:600 19px/1.5 var(--font-px); white-space:pre-line; }
#tbMore{ position:absolute; right:16px; bottom:10px; font-size:14px; animation:blink 1s steps(2) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
#ynGame{ position:absolute; right:8px; bottom:124px; z-index:7; display:flex; flex-direction:column; gap:6px; }
#ynGame button{ width:96px; height:48px; background:var(--p-paper); color:var(--p-ink); border:3px solid var(--p-ink); border-radius:6px; font:600 19px var(--font-px); }
#battleHud .hud{ position:absolute; color:var(--p-ink); font:600 17px/1.2 var(--font-px); }
#battleHud .en{ left:5%; top:5%; width:48%; }
#battleHud .me{ right:5%; top:41%; width:48%; text-align:right; }
.hud .hrow{ display:flex; align-items:center; gap:6px; margin-top:4px; }
.hud .me-row{ justify-content:flex-end; }
.hud .lbl{ font-size:12px; background:var(--p-ink); color:var(--p-y); padding:0 4px; border-radius:2px; }
.hud .hpb{ flex:1; height:8px; border:2px solid var(--p-ink); border-radius:4px; background:var(--p-paper); overflow:hidden; max-width:150px; }
.hud .hpb i{ display:block; height:100%; background:var(--p-green); transition:width .6s ease; }
.hud .hpb i.mid{ background:var(--p-amber); } .hud .hpb i.low{ background:var(--p-red); }
.hud .num{ margin-top:2px; font-variant-numeric:tabular-nums; }

#lower{ position:absolute; top:404px; left:0; right:0; bottom:24px; display:flex; flex-direction:column; gap:10px; padding:12px 14px 10px;
  background:linear-gradient(180deg, var(--p-panel) 0%, var(--p-ink) 100%); }
.info{ display:flex; flex-direction:column; gap:8px; }
.loc{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--p-dim); font-weight:500; letter-spacing:.03em; }
.loc .money{ margin-left:auto; color:var(--p-text); font-variant-numeric:tabular-nums; }
.team-strip{ display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:6px; }
.cap{ background:var(--p-panel2); border:1px solid var(--p-line); border-radius:12px; padding:5px 5px 7px; display:flex; flex-direction:column; align-items:center; gap:3px; color:inherit; }
.cap .hp{ width:100%; }
.free{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:60px; }
.hint{ font-size:13px; color:var(--p-dim); border:1px dashed var(--p-line); padding:8px 14px; border-radius:999px; text-align:center; }
.yesno{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:14px; background:var(--p-ink); border-radius:18px; }
.yesno button{ width:140px; height:60px; border-radius:18px; font-size:19px; font-weight:700; border:1px solid var(--p-line); background:var(--p-panel2); color:var(--p-text); }
.yesno button.yes{ background:var(--p-y); color:var(--p-ink); border-color:var(--p-y); }

.bar{ display:grid; gap:8px; }
.bb{ height:var(--bh, 64px); border-radius:16px; background:var(--p-panel2); border:1px solid var(--p-line); color:var(--p-y);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:0 2px; font-size:11.5px; font-weight:600; min-width:0; touch-action:none; }
.bb span{ color:var(--p-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.bar.s{ --bh:52px; } .bar.m{ --bh:64px; } .bar.l{ --bh:80px; } .bar.l .bb{ font-size:13px; }
.bb.locked{ opacity:.36; }
.bb.lit{ background:var(--p-y); color:var(--p-ink); border-color:var(--p-y2); animation:glow 1.4s ease-in-out infinite; }
.bb.lit span{ color:var(--p-ink); }
@keyframes glow{ 50%{ box-shadow:0 0 0 5px rgba(246,201,51,.28); } }
.bb:active, .ba:active, .mv:active, .row:active{ transform:scale(.97); }
.placeholder{ opacity:.25; outline:2px dashed var(--p-y); outline-offset:-2px; }
.ghost{ position:absolute!important; z-index:40; pointer-events:none; transform:scale(1.08); box-shadow:0 12px 26px rgba(0,0,0,.5); opacity:.95; }
.empty-bar{ text-align:center; font-size:13px; color:var(--p-dim); padding:14px; border:1px dashed var(--p-line); border-radius:16px; }

.bpanel{ flex:1; display:flex; flex-direction:column; gap:10px; min-height:0; }
.bmoves{ display:grid; gap:10px; flex:1; grid-auto-rows:1fr; max-height:300px; }
.bmoves.griglia{ grid-template-columns:1fr 1fr; }
.mv{ min-height:80px; border-radius:18px; background:var(--p-panel2); border:1px solid var(--p-line); color:var(--p-text); text-align:left;
  padding:10px 14px; display:flex; flex-direction:column; justify-content:center; gap:8px; }
.bmoves.colonna .mv{ min-height:58px; flex-direction:row; align-items:center; justify-content:space-between; }
.mv .mn{ font-weight:700; font-size:16px; letter-spacing:.02em; }
.mv .meta{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--p-dim); font-variant-numeric:tabular-nums; }
.bmoves.colonna .mv .meta{ justify-content:flex-end; }
.mv:disabled{ opacity:.45; }
.bacts{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
.ba{ height:58px; border-radius:16px; background:var(--p-ink); border:1px solid var(--p-line); color:var(--p-y); display:flex; align-items:center; justify-content:center; gap:8px; font-weight:700; font-size:15px; touch-action:none; }
.ba span{ color:var(--p-text); }

.type{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700; color:var(--p-ink); letter-spacing:.02em; }
.hp{ display:block; height:6px; border-radius:3px; background:#0f0e19; overflow:hidden; }
.hp i{ display:block; height:100%; background:var(--p-green); }
.hp i.mid{ background:var(--p-amber); } .hp i.low{ background:var(--p-red); }

/* Foglio dei menu */
#sheet{ position:absolute; left:0; right:0; bottom:24px; top:404px; z-index:20; background:var(--p-panel); border-radius:24px 24px 0 0;
  display:flex; flex-direction:column; transform:translateY(105%); transition:transform .24s cubic-bezier(.2,.8,.2,1); box-shadow:0 -12px 30px rgba(0,0,0,.45); }
#sheet.open{ transform:none; }
.sh-head{ display:flex; align-items:center; gap:10px; padding:18px 14px 10px; position:relative; touch-action:none; }
.grab{ position:absolute; top:7px; left:50%; width:42px; height:4px; margin-left:-21px; border-radius:2px; background:var(--p-line); }
#shTitle{ margin:0; flex:1; font-size:21px; font-weight:700; }
.icon-btn{ width:46px; height:46px; border-radius:14px; background:var(--p-panel2); border:1px solid var(--p-line); color:var(--p-text); display:grid; place-items:center; flex:none; }
#shBody{ flex:1; overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y; padding:2px 14px 22px; display:flex; flex-direction:column; gap:8px; }
.row{ display:flex; align-items:center; gap:12px; width:100%; min-height:64px; padding:10px 12px; border-radius:16px; background:var(--p-panel2);
  border:1px solid var(--p-line); color:inherit; text-align:left; }
.row.sel{ border-color:var(--p-y); }
.row.swap{ outline:2px dashed var(--p-y); }
.row .grow{ flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
.row .name{ font-weight:700; font-size:16px; letter-spacing:.02em; }
.row .sub{ color:var(--p-dim); font-size:13px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.row .right{ font-variant-numeric:tabular-nums; color:var(--p-text); font-weight:600; font-size:15px; }
.status{ font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; background:var(--p-red); color:var(--p-ink); }
.acts{ display:flex; gap:8px; padding:2px 0 6px; }
.act{ flex:1; height:50px; border-radius:14px; background:var(--p-y); color:var(--p-ink); font-weight:700; border:0; font-size:15px; }
.act.alt{ background:transparent; color:var(--p-text); border:1px solid var(--p-line); }
.act:disabled{ opacity:.4; }
.stepper{ display:flex; align-items:center; gap:10px; padding:4px 0 2px; }
.stepper button{ width:50px; height:50px; border-radius:14px; border:1px solid var(--p-line); background:var(--p-panel2); color:var(--p-text); font-size:22px; font-weight:700; }
.stepper b{ min-width:44px; text-align:center; font-size:20px; font-variant-numeric:tabular-nums; }
.stepper .tot{ margin-left:auto; color:var(--p-dim); font-size:14px; font-variant-numeric:tabular-nums; }
.segtabs{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:6px; background:var(--p-ink); padding:4px; border-radius:14px; }
.segtabs button{ height:44px; border-radius:11px; border:0; background:transparent; color:var(--p-dim); font-weight:700; font-size:15px; }
.segtabs button.on{ background:var(--p-panel2); color:var(--p-text); }
.sec{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--p-dim); margin:8px 2px 0; }
.chiprow{ display:flex; gap:8px; overflow-x:auto; touch-action:pan-x; padding-bottom:4px; flex:none; }
.mchip{ flex:none; display:flex; align-items:center; gap:6px; height:42px; padding:0 12px 0 6px; border-radius:999px; border:1px solid var(--p-line); background:var(--p-panel2); color:var(--p-text); font-weight:600; font-size:13px; }
.mchip.on{ border-color:var(--p-y); background:var(--p-y); color:var(--p-ink); }
.card-top{ display:flex; gap:14px; align-items:center; background:var(--p-ink); border-radius:18px; padding:14px; }
.card-top .big{ font-size:22px; font-weight:700; letter-spacing:.02em; }
.card-top .grow{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
.stats{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
.stats div{ background:var(--p-panel2); border:1px solid var(--p-line); border-radius:14px; padding:10px 6px; text-align:center; display:flex; flex-direction:column; gap:2px; }
.stats span{ font-size:11px; color:var(--p-dim); font-weight:700; letter-spacing:.06em; }
.stats b{ font-size:19px; font-variant-numeric:tabular-nums; }
.pnote{ font-size:12.5px; color:var(--p-dim); line-height:1.45; margin:6px 2px 0; }
.dexrow{ min-height:56px; }
.dexrow .num{ width:44px; color:var(--p-dim); font-variant-numeric:tabular-nums; font-size:13px; font-weight:600; }
.dexrow.none .name{ color:var(--p-dim); }
.caught{ width:10px; height:10px; border-radius:50%; background:var(--p-y); }
.badges{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; }
.badges div{ aspect-ratio:1; max-width:100%; border-radius:16px; background:var(--p-ink); border:1px solid var(--p-line); display:grid; place-items:center; color:var(--p-line); }
.badges div.got{ color:var(--p-y); }
.kv{ display:flex; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--p-line); font-size:15px; }
.kv b{ font-variant-numeric:tabular-nums; }
.optrow{ display:flex; flex-direction:column; gap:6px; margin-top:6px; }
.optrow > span{ font-size:13px; color:var(--p-dim); font-weight:600; }

#joy{ position:absolute; inset:0; pointer-events:none; z-index:30; opacity:0; transition:opacity .12s; }
#joy.on{ opacity:1; }
.joy-base{ position:absolute; border-radius:50%; background:rgba(23,22,36,.42); border:2px solid rgba(255,247,220,.6); }
.joy-base svg{ position:absolute; inset:0; width:100%; height:100%; }
.joy-knob{ position:absolute; border-radius:50%; background:var(--p-y); box-shadow:0 4px 12px rgba(0,0,0,.4); }
#toast{ position:absolute; left:50%; bottom:132px; transform:translateX(-50%); z-index:45; width:max-content; max-width:360px;
  background:var(--p-text); color:var(--p-ink); padding:11px 15px; border-radius:14px; font-weight:600; font-size:14px; text-align:center; line-height:1.35;
  opacity:0; transition:opacity .2s; pointer-events:none; }
#toast.show{ opacity:1; }

/* ---------- Regolazioni ---------- */
.settings{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:18px; min-width:0; }
.settings h2{ margin:0; font-size:19px; font-weight:700; }
.settings .lead{ margin:4px 0 0; color:var(--muted); font-size:14px; line-height:1.5; }
.set-head{ display:flex; align-items:flex-start; gap:10px; }
.set-head > div{ flex:1; min-width:0; }
#closeSet{ display:none; }
#settingsBody{ display:flex; flex-direction:column; gap:16px; }
.ctl-l{ font-size:13px; font-weight:600; color:var(--muted); margin-bottom:7px; }
.seg{ display:flex; flex-wrap:wrap; gap:6px; }
.seg button, .chip{ border:1px solid var(--line); background:transparent; color:var(--fg); padding:8px 12px; border-radius:12px; font-size:14px; font-weight:500; min-height:40px; }
.seg button[aria-checked="true"], .chip[aria-pressed="true"]{ background:var(--accent-fill); color:var(--on-accent); border-color:var(--accent-fill); font-weight:600; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ display:inline-flex; align-items:center; gap:6px; }
.note{ font-size:13px; color:var(--muted); line-height:1.5; margin:6px 0 0; }
.note.warn{ color:var(--accent); }
.try{ margin:0; padding-left:18px; color:var(--muted); font-size:14px; line-height:1.6; }
.send{ border-top:1px solid var(--line); padding-top:16px; display:flex; flex-direction:column; gap:10px; }
.send h3{ margin:0; font-size:16px; }
textarea{ width:100%; min-height:84px; resize:vertical; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--fg); padding:10px 12px; font:14px/1.45 var(--font-ui); }
.btns{ display:flex; gap:8px; flex-wrap:wrap; }
.primary{ background:var(--fg); color:var(--bg); border:0; border-radius:12px; padding:12px 18px; font-weight:600; font-size:15px; min-height:46px; }
.secondary{ background:transparent; color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:12px 16px; font-weight:600; font-size:15px; min-height:46px; }
#sendStatus{ font-size:14px; color:var(--muted); min-height:20px; }
#sendStatus.ok{ color:var(--ok); }
#scrim{ display:none; }

@media (max-width: 860px){
  .main{ grid-template-columns:1fr; }
  #openSet{ display:inline-block; }
  #closeSet{ display:grid; }
  .settings{ position:fixed; left:0; right:0; bottom:0; z-index:60; max-height:80vh; overflow-y:auto; overscroll-behavior:contain;
    border-radius:22px 22px 0 0; border-bottom:0; transform:translateY(102%); transition:transform .25s ease; box-shadow:0 -16px 40px rgba(0,0,0,.3);
    padding-block:18px calc(20px + env(safe-area-inset-bottom, 0px));
    padding-left:max(18px, env(safe-area-inset-left, 0px)); padding-right:max(18px, env(safe-area-inset-right, 0px)); }
  .settings.open{ transform:none; }
  #scrim.on{ display:block; position:fixed; inset:0; z-index:55; background:rgba(0,0,0,.35); }
  header p{ font-size:13px; }
}
.settings #closeSet{ border:1px solid var(--line); background:transparent; color:var(--fg); }
@media (prefers-reduced-motion: reduce){
  #sheet, .settings, #joy, #toast, .hud .hpb i{ transition:none; }

<script>

/* ---------------- Configurazione ---------------- */
const KEY = 'giallo-touch-lab-v1';

const clone = o => JSON.parse(JSON.stringify(o));
function merge(a, b){ for (const k in b){ if (!(k in a)) continue; if (b[k] && typeof b[k]==='object' && !Array.isArray(b[k]) && a[k] && typeof a[k]==='object') merge(a[k], b[k]); else a[k] = b[k]; } return a; }
function loadCfg(){ try { const s = localStorage.getItem(KEY); if (s) return merge(clone(DEF), JSON.parse(s)); } catch(e){} return clone(DEF); }
function saveCfg(){ try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch(e){} }

cfg.bar.buttons = cfg.bar.buttons.filter(id => BTN[id]);

function setK(k, v){ const ps = k.split('.'); const last = ps.pop(); ps.reduce((o, p) => o[p], cfg)[last] = v; }

/* ---------------- Dati segnaposto ---------------- */
const TC = { Elettro:'#f2c84b', Normale:'#c9c3ad', Erba:'#7cc95a', Veleno:'#c48ae0', Acqua:'#6db3ef', Roccia:'#c9ad78', Volante:'#a9b8f2', Fuoco:'#f58b5c' };
const typeChip = t => `<span class="type" style="background:${TC[t]||'#ccc'}">${t}</span>`;
const TEAM = [
  { n:'VOLTINO', t:['Elettro'], lv:12, hp:31, max:35, col:'#49c6b5', f:'leaf', st:'', stats:{ATT:21,DIF:15,VEL:30,'SPEC.':19},
    mv:[['SCOSSA','Elettro',30,30],['BALZO','Normale',20,20],['SGUARDO FISSO','Normale',30,30],['SCUDO STATICO','Elettro',10,10]] },
  { n:'FOGLIOLO', t:['Erba','Veleno'], lv:10, hp:29, max:29, col:'#7cc443', f:'leaf', st:'', stats:{ATT:16,DIF:17,VEL:14,'SPEC.':20},
    mv:[['RAMETTO','Erba',25,25],['SPINTA','Normale',35,35],['POLLINE','Veleno',20,20]] },
  { n:'BRUMINO', t:['Acqua'], lv:9, hp:12, max:27, col:'#4aa3e0', f:'fin', st:'AVV', stats:{ATT:14,DIF:19,VEL:13,'SPEC.':15},
    mv:[['SPRUZZO','Acqua',25,25],['RITIRATA','Normale',40,40]] },
  { n:'SASSOLO', t:['Roccia'], lv:8, hp:0, max:24, col:'#a99168', f:'rock', st:'KO', stats:{ATT:18,DIF:22,VEL:8,'SPEC.':9},
    mv:[['SASSATA','Roccia',15,15],['SPINTA','Normale',35,35]] },
  { n:'PIUMETTO', t:['Normale','Volante'], lv:7, hp:20, max:22, col:'#d8c08f', f:'wing', st:'', stats:{ATT:13,DIF:12,VEL:17,'SPEC.':11},
    mv:[['BECCO','Volante',35,35],['VENTATA','Volante',35,35]] },
  { n:'FIAMMI', t:['Fuoco'], lv:6, hp:19, max:21, col:'#ee7344', f:'flame', st:'', stats:{ATT:14,DIF:11,VEL:15,'SPEC.':13},
    mv:[['BRACE','Fuoco',25,25],['GRAFFIO','Normale',35,35]] }
];
const BOX = [ { n:'GUSCIOLO', lv:5, col:'#9d7bd8', f:'horn', t:['Normale'] }, { n:'BRUCHETTO', lv:4, col:'#a6c94a', f:'leaf', t:['Erba'] }, { n:'TOPINO', lv:3, col:'#b9a3a0', f:'fin', t:['Normale'] } ];
let BAG = [
  { n:'POZIONE', q:3, d:'Cura 20 PS a un compagno.', use:'heal', p:300 },
  { n:'ANTIDOTO', q:1, d:'Cura l’avvelenamento.', use:'cure', p:100 },

  { n:'REPELLENTE', q:1, d:'Tiene lontane le creature selvatiche per un po’.', use:'field', p:350 },
  { n:'BICICLETTA', key:1, d:'Oggetto chiave.' }, { n:'LENZA', key:1, d:'Oggetto chiave.' }, { n:'MAPPA', key:1, d:'Oggetto chiave.' }
];
const SHOP = [ { n:'POZIONE', p:300 }, { n:'ANTIDOTO', p:100 }, { n:'RISVEGLIO', p:250 }, { n:'REPELLENTE', p:350 }, { n:'CORDA', p:550 } ];
let PCITEMS = [ { n:'POZIONE', q:1 } ];
let money = 3000, lastSave = null, swapMode = false;
const DEXK = { 3:['FOGLIOLO',1], 6:['FIAMMI',1], 9:['BRUMINO',1], 12:['BRUCHETTO',1], 18:['PIUMETTO',1], 21:['TOPINO',1], 31:['VOLTINO',1], 44:['SASSOLO',1], 57:['GUSCIOLO',1], 63:['MUFFOLO',0], 70:['NEBBIOLO',0] };
const COLS = { FOGLIOLO:'#7cc443', FIAMMI:'#ee7344', BRUMINO:'#4aa3e0', BRUCHETTO:'#a6c94a', PIUMETTO:'#d8c08f', TOPINO:'#b9a3a0', VOLTINO:'#49c6b5', SASSOLO:'#a99168', GUSCIOLO:'#9d7bd8', MUFFOLO:'#b07acc', NEBBIOLO:'#9aa6b8' };
const OPT = { anim:'Sì', stile:'Cambio', suono:'Mono' };

function creature(m, size, sil){
  const c = sil ? '#4a4670' : m.col;
  const f = sil ? '' : ({
    leaf:'<rect x="7" y="1" width="2" height="3" fill="#6bbf3a"/><rect x="9" y="1" width="2" height="1" fill="#6bbf3a"/>',

    rock:'<rect x="5" y="3" width="2" height="2" fill="#8a7650"/><rect x="10" y="4" width="2" height="1" fill="#8a7650"/>',
    wing:'<rect x="1" y="8" width="2" height="3" fill="#fff7dc"/><rect x="13" y="8" width="2" height="3" fill="#fff7dc"/>',
    flame:'<rect x="7" y="1" width="2" height="3" fill="#f6c933"/><rect x="8" y="0" width="1" height="2" fill="#ef5b5b"/>'
  }[m.f] || '');
  const eyes = sil ? '' : '<rect x="6" y="8" width="1" height="2" fill="#171624"/><rect x="9" y="8" width="1" height="2" fill="#171624"/><rect x="7" y="11" width="2" height="1" fill="rgba(0,0,0,.25)"/>';

}
function hpCls(hp, max){ const p = max ? hp/max : 0; return p > .5 ? '' : p > .2 ? 'mid' : 'low'; }
const hpBar = (hp, max) => `<span class="hp"><i class="${hpCls(hp,max)}" style="width:${Math.round(100*hp/max)}%"></i></span>`;

/* ---------------- Mappa di prova ---------------- */
const MAP = [
  'TTTTTTTTTTTTTTTTTTTT',
  'T..F.....====...,,,T',
  'T.RRRR...====..,,,,T',
  'T.HWWH...====..,,,,T',
  'T.HDHH..S====...,,,T',
  'T........====....P.T',
  'T..========..====..T',
  'T..=.....LLLL...=..T',
  'T..=..N.........=..T',
  'T..=..~~~~~...K.=..T',
  'T..=..~~~~~..CCC=..T',
  'T..=..~~~~~.....=..T',
  'T..=........F...=..T',
  'T..==========.===..T',
  'T,,,,,...........F.T',
  'T,,,,,..TT.....I...T',
  'T,,,,,..TT.........T',
  'TTTTTTTTTTTTTTTTTTTT'
];
const MW = 20, MHt = MAP.length;
const grid = MAP.map(r => r.split(''));
const ents = [];
grid.forEach((row, y) => row.forEach((ch, x) => {
  if (ch === 'N'){ ents.push({ k:'npc', x, y, dir:'down' }); row[x] = '.'; }
  if (ch === 'K'){ ents.push({ k:'clerk', x, y, dir:'down' }); row[x] = '.'; }
  if (ch === 'I'){ ents.push({ k:'item', x, y }); row[x] = '.'; }
}));
const D = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
const OPP = { up:'down', down:'up', left:'right', right:'left' };
const PASS = new Set(['.', ',', '=', 'F']);
const tile = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MHt) ? 'T' : grid[y][x];
const entAt = (x, y) => ents.find(e => !e.gone && e.x === x && e.y === y);
const canStand = (x, y) => PASS.has(tile(x, y)) && !entAt(x, y);
const dirTo = (ax, ay, bx, by) => bx > ax ? 'right' : bx < ax ? 'left' : by > ay ? 'down' : by < ay ? 'up' : null;

const P = { x:10, y:5, dir:'down', mv:null, par:0 };
const C = { x:10, y:4, dir:'down', mv:null, par:0, emote:0 };
let path = [], pending = null, marker = null, joyDir = null, keyDir = null;
let ctxState = { shop:false, pc:false };
let tab = 'levetta', scene = 'explore';

function tryStep(dir){
  if (P.mv) return false;
  P.dir = dir;
  const [dx, dy] = D[dir];
  let nx = P.x + dx, ny = P.y + dy, jump = false;
  if (tile(nx, ny) === 'L'){ if (dir !== 'down') return false; ny += 1; jump = true; if (!canStand(nx, ny)) return false; }
  else if (!canStand(nx, ny)) return false;
  const now = performance.now(), dur = jump ? 430 : 245;
  const ox = P.x, oy = P.y;
  P.mv = { fx:ox, fy:oy, tx:nx, ty:ny, t0:now, dur, jump }; P.x = nx; P.y = ny; P.par ^= 1;
  const cj = Math.abs(C.x - ox) + Math.abs(C.y - oy) > 1;
  C.dir = dirTo(C.x, C.y, ox, oy) || C.dir;
  C.mv = { fx:C.x, fy:C.y, tx:ox, ty:oy, t0:now, dur, jump:cj }; C.x = ox; C.y = oy; C.par ^= 1;
  return true;
}
function updateContext(){
  const shop = P.y === 11 && P.x >= 13 && P.x <= 15;
  const pc = Math.abs(P.x - 17) + Math.abs(P.y - 5) === 1;
  if (shop !== ctxState.shop || pc !== ctxState.pc){ ctxState = { shop, pc }; syncBarStates(); }
}
function bfs(goals){
  const key = (x, y) => y * MW + x;
  const gm = new Map(goals.map(g => [key(g.x, g.y), g]));
  const start = key(P.x, P.y);
  if (gm.has(start)) return { dirs:[], goal:gm.get(start) };
  const prev = new Map([[start, null]]); const q = [[P.x, P.y]];
  while (q.length){
    const [x, y] = q.shift();
    for (const d of ['up','down','left','right']){
      const [dx, dy] = D[d]; let nx = x + dx, ny = y + dy;
      if (tile(nx, ny) === 'L'){ if (d !== 'down') continue; ny += 1; }
      if (!canStand(nx, ny)) continue;
      const k = key(nx, ny); if (prev.has(k)) continue;
      prev.set(k, [key(x, y), d]);
      if (gm.has(k)){ const dirs = []; let c = k; while (prev.get(c)){ const [pk, dd] = prev.get(c); dirs.unshift(dd); c = pk; } return { dirs, goal:gm.get(k) }; }
      q.push([nx, ny]);
    }
  }
  return null;
}
function targetAt(tx, ty){
  if (C.x === tx && C.y === ty) return { comp:true };
  const e = entAt(tx, ty); if (e) return e;
  const t = tile(tx, ty);
  if (t === 'C') return ents.find(e => e.k === 'clerk');
  if (t === 'S' || t === 'D' || t === 'P') return { x:tx, y:ty, tileT:t };
  return null;
}
function planInteract(t){
  if (t.comp){ const d = dirTo(P.x, P.y, C.x, C.y); if (d) P.dir = d; talkCompanion(); return; }
  const goals = [];
  for (const f of Object.keys(D)){
    const [dx, dy] = D[f];
    const sx = t.x - dx, sy = t.y - dy;
    if ((canStand(sx, sy)) || (sx === P.x && sy === P.y)) goals.push({ x:sx, y:sy, face:f });
    if (tile(sx, sy) === 'C' && canStand(sx - dx, sy - dy)) goals.push({ x:sx - dx, y:sy - dy, face:f });
  }
  const r = bfs(goals);
  if (!r){ marker = { x:t.x, y:t.y, ok:false, t:performance.now() }; return; }
  path = r.dirs; pending = { face:r.goal.face }; marker = { x:t.x, y:t.y, ok:true, t:performance.now() };
}
function interactFacing(){
  const [dx, dy] = D[P.dir]; let x = P.x + dx, y = P.y + dy;
  if (tile(x, y) === 'C'){ x += dx; y += dy; }
  if (C.x === x && C.y === y && !C.mv) return talkCompanion();
  const e = entAt(x, y); if (e) return interactEnt(e);
  const t = tile(x, y);
  if (t === 'S') return say(['PRATO DI PROVA\nQui si provano i comandi.']);
  if (t === 'D') return say(['La porta è chiusa\na chiave.']);
  if (t === 'P') return say(['Hai acceso il PC.'], () => openSheet('pc'));
}
function interactEnt(e){
  if (e.k === 'npc'){ e.dir = OPP[P.dir];
    return say(['Ciao! Vuoi sapere\ncome si usa la levetta?'], null, {
      yes:() => say(['Appoggia il dito dove\nvuoi: la levetta compare lì.', 'Trascina per camminare.\nLascia per fermarti.']),
      no:() => say(['Va bene! Buona\nesplorazione!']) }); }
  if (e.k === 'clerk') return say(['Benvenuto! Posso\naiutarti?'], () => openSheet('negozio'));
  if (e.k === 'item'){ e.gone = true; const b = BAG.find(i => i.n === 'POZIONE'); if (b) b.q++; return say(['Hai trovato una\nPOZIONE!']); }
}

function pos(o, now){
  if (!o.mv) return { x:o.x * 16, y:o.y * 16, hop:0, ph:0 };

function reorderable(container, onTap, onOrder){
  if (!container) return;
  container.addEventListener('pointerdown', e => {
    const item = e.target.closest('[data-reorder]'); if (!item || item.disabled) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY, pid = e.pointerId; let drag = false, cancelled = false, ghost = null, offx = 0, offy = 0;
    const timer = setTimeout(() => {
      drag = true;
      const rr = item.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      ghost = item.cloneNode(true); ghost.classList.add('ghost'); ghost.removeAttribute('data-reorder');
      ghost.style.width = rr.width / scale + 'px'; ghost.style.height = rr.height / scale + 'px';
      ghost.style.left = (rr.left - sr.left) / scale + 'px'; ghost.style.top = (rr.top - sr.top) / scale + 'px';
      offx = (sx - rr.left) / scale; offy = (sy - rr.top) / scale;
      stage.appendChild(ghost); item.classList.add('placeholder');
    }, 320);
    const move = ev => {
      if (ev.pointerId !== pid) return;
      if (!drag){ if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 12){ cancelled = true; clearTimeout(timer); } return; }
      const sr = stage.getBoundingClientRect();

const joy = $('#joy'), jb = $('#joyBase'), jk = $('#joyKnob');

function placeJoy(ox, oy, kx, ky, dir){

  jb.style.left = (ox - R) + 'px'; jb.style.top = (oy - R) + 'px'; jb.style.width = jb.style.height = 2 * R + 'px';
  jk.style.width = jk.style.height = 2 * kr + 'px'; jk.style.left = (ox + kx - kr) + 'px'; jk.style.top = (oy + ky - kr) + 'px';

const toStage = e => { const b = stage.getBoundingClientRect(); return { x:(e.clientX - b.left) / scale, y:(e.clientY - b.top) / scale }; };
let gest = null;
stage.addEventListener('pointerdown', e => {
  const t = e.target;
  if (t.closest('#sheet') || t.closest('[data-reorder]') || t.closest('button')) return;
  const p = toStage(e);
  if (scene === 'battle'){ if (p.y >= ST && p.y < GB) bnext(); return; }
  if (dlg){ gest = { id:e.pointerId, dlg:true }; return; }
  if (SS){ if (p.y < GB) closeSheet(); return; }
  const inGame = p.y >= ST && p.y < GB, z = cfg.joy.zone;
  const joyOK = z === 'ovunque' ? (p.y >= ST && p.y < H - NAV) : z === 'sotto' ? (p.y >= GB && p.y < H - NAV) : inGame;

    dx = dx / dist * R; dy = dy / dist * R;

  const dir = Math.hypot(dx, dy) < R * .28 ? null : (Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));

});
function endGesture(e){
  if (!gest || gest.id !== e.pointerId) return;
  const g = gest; gest = null; joy.classList.remove('on'); joyDir = null;
  if (g.dlg){ advance(); return; }
  if (e.type !== 'pointerup') return;
  const p = toStage(e);
  if (!g.active && Math.hypot(p.x - g.x0, p.y - g.y0) < 12 && performance.now() - g.t0 < 450 && g.inGame) tapGame(p.x, p.y);
}
stage.addEventListener('pointerup', endGesture); stage.addEventListener('pointercancel', endGesture);
function tapGame(x, y){
  const gx = x * 160 / W, gy = (y - ST) * 144 / GH;
  const tx = Math.floor((gx + cam.x) / 16), ty = Math.floor((gy + cam.y) / 16);
  if (tx === P.x && ty === P.y){ if (!P.mv) interactFacing(); return; }
  const t = targetAt(tx, ty);
  if (t && cfg.joy.tapInteract) return planInteract(t);
  if (cfg.joy.tapWalk){
    const now = performance.now();
    if (canStand(tx, ty)){ const res = bfs([{ x:tx, y:ty }]); if (res){ path = res.dirs; pending = null; marker = { x:tx, y:ty, ok:true, t:now }; return; } }
    marker = { x:tx, y:ty, ok:false, t:now };
  }
}
const KEYS = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('textarea, input')) return;
  if (KEYS[e.key]){ e.preventDefault(); keyDir = KEYS[e.key]; return; }
  if (e.key === 'Enter' || e.key === ' '){
    if (e.target.closest && e.target.closest('button')) return;
    e.preventDefault();
    if (scene === 'battle') return bnext();
    if (dlg) return advance();
    if (!SS && !P.mv) interactFacing();
  }
  if (e.key === 'Escape' && SS) closeSheet();
});
window.addEventListener('keyup', e => { if (KEYS[e.key] === keyDir) keyDir = null; });

/* ---------------- Ciclo ---------------- */
function tick(now){
  if (P.mv && now - P.mv.t0 >= P.mv.dur){ P.mv = null; updateContext(); }
  if (C.mv && now - C.mv.t0 >= C.mv.dur) C.mv = null;
  if (scene === 'explore' && !P.mv && !dlg && !SS){
    const held = joyDir || keyDir;
    if (held) tryStep(held);
    else if (path.length){ const d = path.shift(); if (!tryStep(d)){ path = []; pending = null; } }
    else if (pending){ P.dir = pending.face; pending = null; marker = null; interactFacing(); }
    else if (marker && marker.ok) marker = null;
  }
  if (scene === 'battle') drawBattle(now); else drawWorld(now);
  requestAnimationFrame(tick);
}

/* ---------------- Toast, orologio ---------------- */
let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2300); }
function clock(){ $('#clock').textContent = new Date().toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' }); }
clock(); setInterval(clock, 30000);

/* ---------------- Regolazioni ---------------- */
function seg(k, label, opts){
  const v = getK(k);
  return `<div><div class="ctl-l" id="l-${k.replace('.', '-')}">${label}</div><div class="seg" role="radiogroup" aria-labelledby="l-${k.replace('.', '-')}">${opts.map(([val, txt]) =>
    `<button type="button" role="radio" aria-checked="${v === val}" data-k="${k}" data-v='${JSON.stringify(val)}'>${txt}</button>`).join('')}</div></div>`;
}
const YN = [[true, 'Sì'], [false, 'No']];
function renderSettings(){
  let head = '', body = '';
  if (tab === 'levetta'){
    head = '<h2>Levetta e movimento</h2><p class="lead">Appoggia il dito: la levetta compare lì sotto. Trascina per camminare, lascia per fermarti. Si cammina in 4 direzioni, come nel gioco originale.</p>';
    body = seg('joy.zone', 'Dove può comparire la levetta', [['ovunque', 'Ovunque'], ['sotto', 'Solo sotto il gioco'], ['gioco', 'Solo sul gioco']]) +
      seg('joy.mode', 'Se il dito esce dal cerchio', [['fissa', 'La levetta resta ferma'], ['segue', 'La levetta segue il dito']]) +
      seg('joy.size', 'Grandezza della levetta', [['S', 'Piccola'], ['M', 'Media'], ['L', 'Grande']]) +
      seg('joy.tapInteract', 'Toccare persone e oggetti per raggiungerli e parlarci', YN) +
      seg('joy.tapWalk', 'Toccare il terreno per camminare fin lì', YN) +
      seg('dialog.yesno', 'Dove compaiono Sì / No', [['pannello', 'Nel pannello in basso'], ['gioco', 'Sullo schermo di gioco']]) +
      seg('dialog.speed', 'Velocità del testo', [['veloce', 'Veloce'], ['media', 'Media'], ['lenta', 'Lenta']]) +
      `<div><div class="ctl-l">Da provare</div><ul class="try">
        <li>La persona vicino al sentiero ti fa una domanda (Sì / No).</li>
        <li>Il commesso dietro il bancone apre il Negozio.</li>
        <li>Il PC in alto a destra apre il PC.</li>
        <li>Il cartello, la porta, il sacchetto in basso a destra.</li>
        <li>Tocca il tuo compagno che ti segue.</li>
        <li>Scendi verso il basso sulla sporgenza per saltarla.</li>
        <li>Tocca il tuo personaggio: interagisci con ciò che hai davanti.</li></ul></div>`;
  } else if (tab === 'pulsanti'){
    head = '<h2>Pulsanti e menu</h2><p class="lead">Tocca un pulsante per aprire il suo menu. Tieni premuto un pulsante e trascinalo per spostarlo. Nei menu si scorre e si sceglie col dito.</p>';
    body = `<div><div class="ctl-l">Pulsanti nella barra (tocca per aggiungere o togliere)</div><div class="chips">${Object.keys(BTN).map(id =>
        `<button type="button" class="chip" aria-pressed="${cfg.bar.buttons.includes(id)}" data-chip="${id}">${svg(BTN[id].i, 18)}${BTN[id].l}</button>`).join('')}</div></div>` +
      seg('bar.rows', 'Righe', [[1, 'Una riga'], [2, 'Due righe']]) +
      seg('bar.labels', 'Contenuto dei pulsanti', [[true, 'Icona e nome'], [false, 'Solo icona']]) +
      seg('bar.size', 'Grandezza dei pulsanti', [['s', 'Piccoli'], ['m', 'Medi'], ['l', 'Grandi']]) +
      seg('bar.pos', 'Posizione della barra', [['basso', 'In fondo, sotto il pollice'], ['alto', 'Subito sotto il gioco']]) +
      seg('bar.info', 'Riquadro con luogo e squadra', [[true, 'Mostra'], [false, 'Nascondi']]) +
      seg('menu.style', 'Come si aprono i menu', [['foglio', 'Dal basso, il gioco resta visibile'], ['intero', 'A tutto schermo']]) +
      seg('bar.shop', 'Negozio e PC', [['contesto', 'Solo davanti al bancone o al PC'], ['sempre', 'Sempre utilizzabili']]) +
      `<p class="note ${cfg.bar.shop === 'sempre' ? 'warn' : ''}">Nel gioco originale il negozio e il PC si usano solo sul posto. Con «Solo davanti…» il pulsante si illumina quando sei lì. «Sempre utilizzabili» sarebbe una meccanica nuova: la inserisco solo se la approvi.</p>`;
  } else {
    head = '<h2>Lotta</h2><p class="lead">Tocca una mossa per usarla. Tieni premuto Squadra, Borsa o Fuga e trascinali per cambiarne l\'ordine. Tocca lo schermo di gioco per far scorrere i messaggi.</p>';
    body = seg('battle.layout', 'Disposizione delle mosse', [['griglia', 'Griglia 2 × 2'], ['colonna', 'Una sotto l\'altra']]) +
      seg('battle.actions', 'Squadra, Borsa, Fuga', [['sotto', 'Sotto le mosse'], ['sopra', 'Sopra le mosse']]) +
      seg('battle.showType', 'Mostra il tipo della mossa', YN) +
      seg('battle.showPP', 'Mostra i PP', YN) +
      seg('menu.style', 'Come si aprono Squadra e Borsa', [['foglio', 'Dal basso'], ['intero', 'A tutto schermo']]) +
      '<p class="note">Dell\'avversario si vede solo la barra dei PS, senza numeri, come nell\'originale.</p>';
  }
  $('#setHead').innerHTML = head; $('#settingsBody').innerHTML = body;
}
$('#settings').addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  if (b){ setK(b.dataset.k, JSON.parse(b.dataset.v)); saveCfg(); applyCfg(); renderSettings(); return; }
  const c = e.target.closest('[data-chip]');
  if (c){ const id = c.dataset.chip, arr = cfg.bar.buttons; const i = arr.indexOf(id); if (i >= 0) arr.splice(i, 1); else arr.push(id); saveCfg(); applyCfg(); renderSettings(); return; }
});
function applyCfg(){
  if (scene === 'battle'){ renderLower(); }
  else renderLower();
  if (SS){ $('#sheet').style.top = (cfg.menu.style === 'intero' ? ST : GB) + 'px'; renderSheet(); }
  syncYN();
}

/* ---------------- Schede (tab) ---------------- */
function setTab(t){
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  if (SS) closeSheet();
  if (dlg){ clearInterval(dlg.iv); dlg = null; }
  if (bq){ clearTimeout(bq.timer); bq = null; B.busy = false; }
  path = []; pending = null; marker = null; joyDir = null;
  scene = t === 'lotta' ? 'battle' : 'explore';
  $('#battleHud').hidden = scene !== 'battle';
  if (scene === 'battle'){ renderHud(); setBText(bPrompt()); }
  else $('#textbox').hidden = true;
  syncYN(); renderLower(); renderSettings();
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

/* ---------------- Adattamento allo schermo ---------------- */
const narrow = () => matchMedia('(max-width: 860px)').matches;
function fit(){
  const imm = holder.classList.contains('imm');
  let aw, ah;
  if (imm){ aw = innerWidth; ah = innerHeight; }
  else {
    const col = $('#stageCol'); aw = col.clientWidth;
    const top = col.getBoundingClientRect().top + scrollY;
    ah = Math.max(440, innerHeight - top - 18);
  }
  const s = Math.min(aw / W, ah / H, imm ? 3 : 1);
  scale = s; stage.style.transform = `scale(${s})`;
  if (imm){ stage.style.left = ((aw - W * s) / 2) + 'px'; stage.style.top = ((ah - H * s) / 2) + 'px'; }
  else { holder.style.width = (W * s) + 'px'; holder.style.height = (H * s) + 'px'; stage.style.left = '0px'; stage.style.top = '0px'; }
}
window.addEventListener('resize', fit);
$('#immBtn').addEventListener('click', () => { holder.classList.add('imm'); $('#exitImm').hidden = false; document.body.style.overflow = 'hidden'; fit(); });
$('#exitImm').addEventListener('click', () => { holder.classList.remove('imm'); $('#exitImm').hidden = true; document.body.style.overflow = ''; fit(); });
function toggleSettings(on){ $('#settings').classList.toggle('open', on); $('#scrim').classList.toggle('on', on); }
$('#openSet').addEventListener('click', () => toggleSettings(true));
$('#closeSet').addEventListener('click', () => toggleSettings(false));
$('#scrim').addEventListener('click', () => toggleSettings(false));

/* ---------------- Invio a Claude ---------------- */
let dbP = null;
try { dbP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('db') : Promise.resolve(null); } catch(e){ dbP = Promise.resolve(null); }
function summary(){
  const j = cfg.joy, b = cfg.bar, t = cfg.battle, d = cfg.dialog;
  const yn = v => v ? 'sì' : 'no';
  return [
    `Levetta: compare ${({ ovunque:'ovunque', sotto:'solo sotto il gioco', gioco:'solo sul gioco' })[j.zone]}; ${j.mode === 'fissa' ? 'resta ferma' : 'segue il dito'}; grandezza ${({ S:'piccola', M:'media', L:'grande' })[j.size]}; tocco su persone/oggetti: ${yn(j.tapInteract)}; tocco sul terreno: ${yn(j.tapWalk)}.`,
    `Dialoghi: Sì/No ${d.yesno === 'pannello' ? 'nel pannello in basso' : 'sullo schermo di gioco'}; testo ${d.speed}.`,
    `Barra: ${b.buttons.map(id => BTN[id].l).join(', ') || 'vuota'}; ${b.rows} ${b.rows === 1 ? 'riga' : 'righe'}; ${b.labels ? 'icona e nome' : 'solo icona'}; grandezza ${({ s:'piccoli', m:'medi', l:'grandi' })[b.size]}; posizione ${b.pos === 'basso' ? 'in fondo' : 'sotto il gioco'}; riquadro luogo/squadra: ${yn(b.info)}; Negozio/PC: ${b.shop === 'contesto' ? 'solo sul posto' : 'sempre'}.`,
    `Menu: ${cfg.menu.style === 'foglio' ? 'dal basso' : 'a tutto schermo'}.`,
    `Lotta: mosse ${t.layout === 'griglia' ? 'a griglia 2×2' : 'in colonna'}; azioni ${t.actions} le mosse (${t.order.map(id => BACT[id].l).join(', ')}); tipo: ${yn(t.showType)}; PP: ${yn(t.showPP)}.`
  ].join('\n');
}
$('#sendBtn').addEventListener('click', async () => {
  const st = $('#sendStatus'), btn = $('#sendBtn');
  st.className = ''; st.textContent = 'Invio in corso…'; btn.disabled = true;
  const note = $('#note').value.trim().slice(0, 2000);
  let db = null; try { db = await dbP; } catch(e){}
  const fallback = msg => { st.textContent = msg; const s = $('#summary'); s.hidden = false; s.value = summary() + (note ? '\nNote: ' + note : ''); btn.disabled = false; };
  if (!db) return fallback('Da questa vista non riesco a inviare. Copia il riepilogo qui sotto e incollalo in chat.');
  const payload = { scheda:tab, cfg:clone(cfg), riepilogo:summary(), nota:note, inviatoIl:new Date().toISOString() };
  const attempt = () => db.collection('invii').add(payload);
  try { await attempt(); }
  catch(e){
    if (e && e.code === 'unavailable'){ try { await new Promise(r => setTimeout(r, 700 + Math.random() * 600)); await attempt(); } catch(e2){ return fallback('Invio non riuscito. Copia il riepilogo qui sotto e incollalo in chat.'); } }
    else return fallback('Invio non riuscito. Copia il riepilogo qui sotto e incollalo in chat.');
  }
  st.className = 'ok'; st.textContent = 'Inviato alle ' + new Date().toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' }) + '. Claude può leggerlo.'; btn.disabled = false;
});
$('#resetBtn').addEventListener('click', () => { cfg = clone(DEF); saveCfg(); applyCfg(); renderSettings(); $('#sendStatus').textContent = 'Predefiniti ripristinati.'; });

/* ---------------- Avvio ---------------- */
setTab('levetta');
fit();
setTimeout(fit, 300);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
requestAnimationFrame(tick);
setTimeout(() => toast('Appoggia il dito e trascina per muoverti'), 600);
})();
</script>
